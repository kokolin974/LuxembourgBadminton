# Used automatically (spring.profiles.active: dev) for local development
# without Docker/Postgres. Data resets every restart.
spring:
  datasource:
    url: jdbc:h2:file:./data/badminton-map;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
