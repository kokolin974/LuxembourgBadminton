<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin — Badminton Clubs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>Admin — Clubs</h1>
        <a class="header-link" th:href="@{/}">View map</a>
    </header>

    <main class="admin">
        <section class="admin-form">
            <h2 th:text="${editingId != null} ? 'Edit club' : 'Add a club'"></h2>
            <!--
                Latitude/longitude are entered by hand for now. The natural
                next step is a "look up city" action here that geocodes the
                city name (e.g. via the free Nominatim/OSM API) and fills
                these two fields in automatically.
            -->
            <form th:action="${editingId != null} ? @{/admin/clubs/{id}/update(id=${editingId})} : @{/admin/clubs}"
                  th:object="${clubForm}" method="post">
                <label>
                    Name
                    <input type="text" th:field="*{name}" required/>
                </label>
                <label>
                    City
                    <input type="text" th:field="*{city}" required/>
                </label>
                <div class="admin-form-row">
                    <label>
                        Latitude
                        <input type="number" step="any" th:field="*{latitude}" required/>
                    </label>
                    <label>
                        Longitude
                        <input type="number" step="any" th:field="*{longitude}" required/>
                    </label>
                </div>
                <label>
                    Club Level
                    <select th:field="*{levelId}" required>
                        <option th:each="lvl : ${levels}" th:value="${lvl.level}"
                                th:text="${lvl.level} + ' - ' + ${lvl.label} + ' (' + ${lvl.radiusKm} + ' km)'"></option>
                    </select>
                </label>
                <label>
                    Radius override (km)
                    <input type="number" step="any" th:field="*{radiusOverrideKm}"
                           placeholder="Leave blank to use the level's default"/>
                </label>
                <label>
                    Filière
                    <select th:field="*{filiere}">
                        <option value="">—</option>
                        <option value="Performance">Performance</option>
                        <option value="Active for life">Active for life</option>
                    </select>
                </label>
                <p class="admin-form-hint">One field per level of the club house, foundation to roof:</p>
                <label class="level-membership">
                    Membership
                    <textarea th:field="*{membership}" rows="2"></textarea>
                </label>
                <label class="level-club-activities">
                    Club Activities
                    <textarea th:field="*{clubActivities}" rows="2"></textarea>
                </label>
                <label class="level-human-resources">
                    Human Resources
                    <textarea th:field="*{humanResources}" rows="2"></textarea>
                </label>
                <label class="level-finance">
                    Finance
                    <textarea th:field="*{finance}" rows="2"></textarea>
                </label>
                <label class="level-communication">
                    Communication
                    <textarea th:field="*{communication}" rows="2"></textarea>
                </label>
                <label class="level-governance">
                    Governance
                    <textarea th:field="*{governance}" rows="2"></textarea>
                </label>
                <label class="level-vision-strategy">
                    Vision &amp; Strategy
                    <textarea th:field="*{visionStrategy}" rows="2"></textarea>
                </label>
                <button type="submit" th:text="${editingId != null} ? 'Update club' : 'Add club'"></button>
                <a th:if="${editingId != null}" th:href="@{/admin/clubs}" class="admin-cancel">Cancel</a>
            </form>
        </section>

        <section class="admin-list">
            <h2>Existing clubs</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>City</th>
                        <th>Level</th>
                        <th>Filière</th>
                        <th>Radius</th>
                        <th>Coordinates</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="club : ${clubs}">
                        <td><a th:href="@{/admin/clubs/{id}/edit(id=${club.id})}" th:text="${club.name}"></a></td>
                        <td th:text="${club.city}"></td>
                        <td th:text="${club.level != null} ? ${club.level.label} : '—'"></td>
                        <td th:text="${club.filiere != null and !club.filiere.isEmpty()} ? ${club.filiere} : '—'"></td>
                        <td>
                            <span th:text="${club.effectiveRadiusKm} + ' km'"></span>
                            <span th:if="${club.radiusOverrideKm != null}" class="admin-radius-override">(override)</span>
                        </td>
                        <td th:text="${club.latitude} + ', ' + ${club.longitude}"></td>
                        <td>
                            <form th:action="@{/admin/clubs/{id}/delete(id=${club.id})}" method="post">
                                <button type="submit" class="admin-delete">Delete</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
