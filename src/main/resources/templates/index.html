<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Badminton Clubs — Luxembourg</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
    <header>
        <h1>Badminton Clubs in Luxembourg</h1>
        <a class="header-link" th:href="@{/admin/clubs}">Admin</a>
    </header>

    <div id="map"></div>

    <div id="level-filter" class="level-filter"></div>

    <aside id="schedule-panel" class="schedule-panel" hidden>
        <button id="schedule-panel-close" class="club-panel-close" aria-label="Close">&times;</button>
        <div id="schedule-panel-content"></div>
    </aside>

    <aside id="club-panel" class="club-panel" hidden>
        <button id="club-panel-close" class="club-panel-close" aria-label="Close">&times;</button>
        <div id="club-panel-content"></div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Weekly schedule popup: FullCalendar's bundled build (core + timeGrid
         + interaction plugins), MIT-licensed, CSS is injected by the JS itself -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"
            integrity="sha384-B1OFx8Gy9GjPu8UbUyXbGQpzll9ubAUQ9agInFJ8NnD7nYG1u/CLR+Sqr5yifl4q" crossorigin="anonymous"></script>
    <script th:src="@{/js/map.js}"></script>
</body>
</html>
